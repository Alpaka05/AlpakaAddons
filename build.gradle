plugins {
    id "net.fabricmc.fabric-loom" version "1.17.20"
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "2.1.10"
}

version = project.property("mod_version")
group = project.property("maven_group")

base {
    archivesName = project.property("mod_id")
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.property("minecraft_version")}"

    // Fabric Loader & API
    implementation "net.fabricmc:fabric-loader:${project.property("loader_version")}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.property("fabric_version")}"

    // Mixin compile dependency
    compileOnly "org.spongepowered:mixin:0.8.5"

    // Mod Menu: compiled against, and present in the dev client so its Mods screens can be tested.
    // localRuntime keeps it out of the published POM. Players get it from their own mod list.
    compileOnly "com.terraformersmc:modmenu:20.0.1"
    localRuntime "com.terraformersmc:modmenu:20.0.1"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

tasks.processResources {
    inputs.property("version", project.version)

    filesMatching("fabric.mod.json") {
        expand([version: project.version])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    // Sources contain non-ASCII literals (Hypixel's ⏣ area marker, the ◆ rune prefix). Without this
    // javac uses the platform charset - windows-1252 on this machine - and silently mangles them.
    options.encoding = "UTF-8"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_23
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

/**
 * Copies the finished jar into whichever launcher is currently being played on.
 *
 * The target is `deploy_target` in gradle.properties - "modrinth", "oneclient", "both" or "none" -
 * and a one-off run can override it without editing anything:
 *
 *     ./gradlew build -Pdeploy_target=oneclient
 */
def deployToLauncher(File jarFile, String versionStr) {
    def target = (project.findProperty("deploy_target") ?: "modrinth").toString().toLowerCase()

    if (target == "none") {
        println "deploy_target=none - jar left in build/libs only."
        return
    }
    if (target !in ["modrinth", "oneclient", "both"]) {
        println "Unknown deploy_target '${target}'. Expected modrinth, oneclient, both or none."
        return
    }

    if (target in ["modrinth", "both"]) deployToModrinth(jarFile, versionStr)
    if (target in ["oneclient", "both"]) deployToOneClient(jarFile, versionStr)
}

/**
 * Drops the jar into one Modrinth App profile's mods folder.
 *
 * Only that one folder, unlike the OneClient deploy below: the Modrinth App keeps a profile's mods
 * where you would expect them and does not re-materialise stale copies out of a package cache, so
 * there is nothing to hunt down afterwards. Old alpaka jars in the profile are removed first, since
 * a version bump changes the filename and two of them would make Fabric refuse to start on a
 * duplicate mod id.
 */
def deployToModrinth(File jarFile, String versionStr) {
    def profileName = (project.findProperty("modrinth_profile") ?: "").toString()
    if (profileName.isEmpty()) {
        println "No modrinth_profile set in gradle.properties - skipping Modrinth deployment."
        return
    }

    def homeDir = System.getProperty("user.home")
    def appData = System.getenv("APPDATA")
    def roots = [
        appData ? new File(appData, "ModrinthApp") : null,
        new File("${homeDir}/Library/Application Support/ModrinthApp"),
        new File("${homeDir}/.local/share/ModrinthApp")
    ].findAll { it != null && it.exists() }

    if (roots.isEmpty()) {
        println "No Modrinth App directory found for deployment."
        return
    }

    def targetName = "alpaka-${versionStr}.jar"
    def deployed = false

    roots.each { root ->
        def profilesDir = new File(root, "profiles")
        def profileDir = new File(profilesDir, profileName)
        if (!profileDir.exists()) {
            // Named rather than silently skipped: a typo in the profile name would otherwise look
            // exactly like a successful build, with the game still running the previous jar.
            def available = profilesDir.exists() ? profilesDir.listFiles()?.findAll { it.isDirectory() }*.name : []
            println "Modrinth profile '${profileName}' not found in ${profilesDir.absolutePath}."
            println "  Available profiles: ${available ? available.join(', ') : '(none)'}"
            return
        }

        def modsDir = new File(profileDir, "mods")
        modsDir.mkdirs()
        modsDir.listFiles()?.findAll { it.name.startsWith("alpaka") && it.name.endsWith(".jar") && it.name != targetName }?.each {
            if (it.delete()) println "Removed old mod file: ${it.name} from Modrinth profile '${profileName}'"
            else println "Warning: could not remove ${it.name} (game running?) - two alpaka jars will break Fabric startup."
        }

        def destFile = new File(modsDir, targetName)
        try {
            java.nio.file.Files.copy(jarFile.toPath(), destFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "Deployed ${targetName} to Modrinth profile: ${profileName}"
            deployed = true
        } catch (Exception e) {
            println "Warning: Could not write ${destFile.absolutePath} (file may be in use by running game): ${e.message}"
        }
    }

    if (!deployed) println "Modrinth deployment did not place the jar anywhere."
}

def deployToOneClient(File jarFile, String versionStr) {
    def homeDir = System.getProperty("user.home")
    def targetName = "alpaka-${versionStr}.jar"
    def localAppData = System.getenv("LOCALAPPDATA")
    def appData = System.getenv("APPDATA")

    def candidateDirs = [
        new File("${homeDir}/Library/Application Support/org.Polyfrost.OneClient"),
        localAppData ? new File(localAppData, "Polyfrost/OneClient/data") : null,
        appData ? new File(appData, "OneClient") : null
    ].findAll { it != null && it.exists() }

    if (candidateDirs.isEmpty()) {
        println "No OneClient directory found for deployment."
        return
    }

    candidateDirs.each { oneClientDir ->
        println "Deploying to OneClient directory: ${oneClientDir.absolutePath}"

        // 1. Replace ALL existing alpaka jar files anywhere in OneClient caches & imported packages
        oneClientDir.eachFileRecurse { f ->
            if (f.isFile() && f.name.startsWith("alpaka") && f.name.endsWith(".jar")) {
                try {
                    java.nio.file.Files.copy(jarFile.toPath(), f.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    println "Overwrote OneClient cached jar: ${f.absolutePath}"
                } catch (Exception e) {
                    println "Failed to overwrite ${f.absolutePath}: ${e.message}"
                }
            }
        }

        // 2. Ensure new version jar is copied to all cluster mods directories
        def clustersDir = new File(oneClientDir, "clusters")
        if (clustersDir.exists()) {
            clustersDir.listFiles()?.findAll { it.isDirectory() }?.each { clusterFolder ->
                def modsFolder = new File(clusterFolder, "mods")
                if (modsFolder.exists()) {
                    modsFolder.listFiles()?.findAll { it.name.startsWith("alpaka") && it.name.endsWith(".jar") && it.name != targetName }?.each {
                        it.delete()
                        println "Removed old mod file: ${it.name} from ${clusterFolder.name}"
                    }
                    def destFile = new File(modsFolder, targetName)
                    java.nio.file.Files.copy(jarFile.toPath(), destFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    println "Deployed ${targetName} to OneClient cluster: ${clusterFolder.name}"
                }
            }
        }

        // 3. Ensure copy to .minecraft/mods
        def mcModsDir = new File(oneClientDir, ".minecraft/mods")
        mcModsDir.mkdirs()
        mcModsDir.listFiles()?.findAll { it.name.startsWith("alpaka") && it.name.endsWith(".jar") && it.name != targetName }?.each {
            try { it.delete() } catch (Exception ignored) {}
        }
        def destMcFile = new File(mcModsDir, targetName)
        try {
            java.nio.file.Files.copy(jarFile.toPath(), destMcFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "Deployed ${targetName} to .minecraft/mods"
        } catch (Exception e) {
            println "Warning: Could not overwrite ${destMcFile.absolutePath} (file may be in use by running game): ${e.message}"
        }

        // 4. Clear Fabric Loader processedMods cache
        def processedDir = new File(oneClientDir, ".minecraft/.fabric/processedMods")
        if (processedDir.exists()) {
            processedDir.listFiles()?.findAll { it.name.startsWith("alpaka") }?.each {
                try {
                    it.delete()
                    println "Cleared Fabric processedMod cache: ${it.name}"
                } catch (Exception e) {
                    println "Warning: Could not clear cache ${it.name}: ${e.message}"
                }
            }
        }
    }
}

tasks.named("jar") {
    doFirst {
        def libsDir = file("${layout.buildDirectory.get()}/libs")
        if (libsDir.exists()) {
            libsDir.listFiles()?.findAll { it.name.startsWith("alpaka-") && it.name.endsWith(".jar") && !it.name.contains(project.version.toString()) }?.each {
                it.delete()
                println "Cleaned up old version jar: ${it.name} from build/libs"
            }
        }
    }
}

/**
 * Copies the built jar into the launcher named by `deploy_target`.
 *
 * A task of its own rather than a `doLast` on `jar`, because switching launcher is a reason to
 * deploy that leaves the sources untouched: with the copy hanging off `jar`, an up-to-date jar meant
 * `./gradlew build -Pdeploy_target=...` printed nothing and copied nothing. Never up to date, since
 * what it is bringing up to date lives outside the build directory.
 */
tasks.register("deployJar") {
    dependsOn(tasks.named("jar"))
    outputs.upToDateWhen { false }
    doLast {
        deployToLauncher(tasks.named("jar").get().archiveFile.get().asFile, project.version.toString())
    }
}

tasks.named("build") {
    finalizedBy(tasks.named("deployJar"))
}

/**
 * Dev client.
 *
 * `./gradlew runClient` starts the game from `run/` with this mod on the classpath. Passing
 * `-PquickPlayWorld="<save name>"` skips the menus and loads that world from `run/saves/` straight
 * away, which is what makes an unattended in-game check of the HUD and world rendering possible.
 */
loom {
    runs {
        client {
            if (project.hasProperty("quickPlayWorld")) {
                programArgs("--quickPlaySingleplayer", project.property("quickPlayWorld").toString())
            }
        }
    }
}



