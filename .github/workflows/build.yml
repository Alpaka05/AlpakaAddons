# Compiles the mod and runs the tests on every push to a release line and on every pull request,
# so a broken build or a failing test shows up in the PR instead of in the game.
#
# Nothing is published from here: releases stay a tag pushed by hand. The jar each run builds is
# kept as an artifact so a PR build can be tried out directly.
name: Build

on:
  push:
    branches: [main, mc-26.1.2]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The version comes from `git describe --tags`, which needs the full history and the tags;
      # a shallow clone would name every jar 0.0.0+unknown.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and Loom's Minecraft downloads, and checks the wrapper jar is genuine.
      - uses: gradle/actions/setup-gradle@v6

      # deploy_target=none: `build` would otherwise copy the jar into a local launcher profile.
      - name: Build and test
        run: ./gradlew build -Pdeploy_target=none --stacktrace

      - name: Report test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/test-results/test/*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: alpaka-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
