# Done to increase performance of Gradle builds
org.gradle.jvmargs=-Xmx3G

# Fabric Properties
minecraft_version=26.2
loader_version=0.19.5

# Mod Properties
mod_id=alpaka
mod_name=Alpaka Addons
mod_version=1.1.52
maven_group=net.alpaka.addons

# Where `./gradlew build` puts the finished jar: modrinth, oneclient, both or none.
# Override for a single run without editing this file:  ./gradlew build -Pdeploy_target=oneclient
deploy_target=modrinth
# Which Modrinth App profile receives it. Must match the profile's folder name exactly.
modrinth_profile=Fabric 26.2

# Dependencies (Fabric API)
fabric_version=0.159.0+26.2

# Kotlin Options
kotlin.jvm.target.validation.mode=ignore

