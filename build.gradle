plugins {
    id "fabric-loom" version "1.13.6"
    id "maven-publish"
}

version = project.property("mod_version")
group = project.property("maven_group")

base {
    archivesName = project.property("mod_id")
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.property("minecraft_version")}"

    // Fabric Loader & API
    implementation "net.fabricmc:fabric-loader:${project.property("loader_version")}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.property("fabric_version")}"
    implementation "net.fabricmc.fabric-api:fabric-command-api-v2:3.0.5+e2bdee784c"

    // Mixin compile dependency
    compileOnly "org.spongepowered:mixin:0.8.5"

    // Mod Menu compile dependency
    compileOnly "com.terraformersmc:modmenu:20.0.0-beta.2"
}

tasks.processResources {
    inputs.property("version", project.version)

    filesMatching("fabric.mod.json") {
        expand([version: project.version])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def oneClientDir = file("${System.getProperty("user.home")}/Library/Application Support/org.Polyfrost.OneClient")
def minecraftModsDir = file("${System.getProperty("user.home")}/Library/Application Support/org.Polyfrost.OneClient/.minecraft/mods")
def fabricProcessedDir = file("${System.getProperty("user.home")}/Library/Application Support/org.Polyfrost.OneClient/.minecraft/.fabric/processedMods")

tasks.named("runClient") {
    dependsOn(tasks.jar)
    doLast {
        def jarFile = tasks.jar.archiveFile.get().asFile
        def targetName = "alpaka-${project.version}.jar"

        // 1. Copy to .minecraft/mods where OneClient auto-detects new/updated mods
        minecraftModsDir.mkdirs()
        if (minecraftModsDir.exists()) {
            minecraftModsDir.listFiles()?.findAll { it.name.startsWith("alpaka") }?.each { it.delete() }
            project.copy {
                from jarFile
                into minecraftModsDir
                rename { targetName }
            }
            println "Copied ${targetName} to .minecraft/mods"
        }

        // 2. Clear Fabric Loader's processedMods cache for alpaka
        if (fabricProcessedDir.exists()) {
            fabricProcessedDir.listFiles()?.findAll { it.name.startsWith("alpaka") }?.each {
                it.delete()
                println "Deleted Fabric processedMod cache: ${it.name}"
            }
        }

        // 3. Update all existing alpaka jar files in OneClient launcher caches
        if (oneClientDir.exists()) {
            oneClientDir.eachFileRecurse { targetFile ->
                if (targetFile.isFile() && targetFile.name.startsWith("alpaka") && targetFile.name.endsWith(".jar")) {
                    project.copy {
                        from jarFile
                        into targetFile.parentFile
                        rename { targetFile.name }
                    }
                    println "Updated OneClient mod file: ${targetFile.absolutePath}"
                }
            }
        }

        // 4. Launch OneClient app
        new ProcessBuilder("open", "-a", "/Applications/OneClient.app").start()
    }
}


